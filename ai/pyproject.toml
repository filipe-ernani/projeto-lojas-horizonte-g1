[project]
name = "ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "databricks-sql-connector>=4.9.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: consultas reais ao Databricks, habilitadas explicitamente"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
