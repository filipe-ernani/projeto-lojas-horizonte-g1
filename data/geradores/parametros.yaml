# Parâmetros dos geradores sintéticos da Lojas Horizonte.
# Todos os números de negócio dos dados sintéticos ficam aqui, em um só lugar,
# para serem revisados, ajustados e explicados na apresentação.

seed: 42  # semente fixa: o mesmo arquivo gera sempre o mesmo resultado

catalogo:
  arquivo_saida: data/referencia/catalogo.csv

  # Faixas de preço (R$) calibradas pelo Olist:
  # quartis de horizonte.silver.marketplace_itens
  # (filtro: valido AND incluir AND periodo_completo), notebook 04_calibracao_catalogo.
  #
  # margem = margem bruta sobre o preço de venda -> custo = preco * (1 - margem).
  # As margens são premissas do squad (o Olist não tem custo).
  #
  # skus = quantidade de produtos da categoria no catálogo. A distribuição
  # privilegia vestuário, que é o núcleo de uma rede de moda.
  #
  # Regra de preço (para itens parecidos terem preços coerentes):
  # - tipos: listados do MAIS BARATO para o MAIS CARO. O preço-base de cada tipo
  #   é um ponto da faixa de preço do Olist, espaçado entre os quantis 15% e 85%.
  # - complementos: também do mais barato para o mais caro; aplicam um fator
  #   de 0,90 (primeiro) a 1,15 (último) sobre o preço-base.
  # - cor: não muda o preço. Mesmo modelo em cores diferentes = mesmo preço.
  categorias:
    Feminino:
      grupo: Vestuário
      skus: 45
      preco: {p25: 29.99, mediana: 49.00, p75: 65.90}   # Olist: só 47 itens, referência fraca
      margem: 0.60
      tipos: [Short, Blusa, Saia, Camisa, Calça, Macacão, Vestido, Jaqueta]
      complementos: [Malha, Algodão, Jeans, Viscose, Tricô, Linho, Cetim]
    Masculino:
      grupo: Vestuário
      skus: 35
      preco: {p25: 40.90, mediana: 59.90, p75: 126.90}  # Olist: 130 itens
      margem: 0.60
      tipos: [Camiseta, Bermuda, Polo, Camisa, Calça, Moletom, Jaqueta]
      complementos: [Malha, Algodão, Piquet, Sarja, Jeans, Linho]
    Infantil:
      grupo: Vestuário
      skus: 20
      preco: {p25: 39.99, mediana: 49.90, p75: 89.99}   # Olist: só 8 itens, referência fraca
      margem: 0.58
      tipos: [Body, Camiseta, Bermuda, Pijama, Vestido, Conjunto]
      complementos: [Malha, Algodão, Estampado, Moletom]
    Calçados:
      grupo: Vestuário
      skus: 25
      preco: {p25: 35.90, mediana: 79.90, p75: 99.90}   # Olist: 259 itens
      margem: 0.50
      tipos: [Chinelo, Sapatilha, Sandália, Tênis, Mocassim, Bota]
      complementos: [Casual, Tressê, Confort, Esportivo, Couro]
    Moda íntima e praia:
      grupo: Vestuário
      skus: 15
      preco: {p25: 49.90, mediana: 59.90, p75: 79.90}   # Olist: 131 itens
      margem: 0.62
      tipos: [Calcinha, Cueca, Sutiã, Sunga, Biquíni, Maiô]
      complementos: [Básico, Microfibra, Estampado, Renda]
    Acessórios:
      grupo: Acessórios
      skus: 25
      preco: {p25: 49.90, mediana: 102.90, p75: 180.00} # Olist: 9.069 itens
      margem: 0.55
      tipos: [Carteira, Cinto, Óculos de Sol, Mochila, Bolsa, Relógio, Mala]
      complementos: [Sintético, Casual, Viagem, Clássico, Couro]
    Esporte:
      grupo: Esporte
      skus: 15
      preco: {p25: 44.00, mediana: 77.90, p75: 129.90}  # Olist: 8.603 itens
      margem: 0.45
      tipos: [Garrafa, Top, Camiseta Dry, Bermuda, Legging, Tapete de Yoga]
      complementos: [Treino, Fitness, Running, Performance]
    Beleza:
      grupo: Beleza
      skus: 12
      preco: {p25: 44.50, mediana: 79.99, p75: 138.90}  # Olist: 12.958 itens
      margem: 0.40
      tipos: [Sabonete Líquido, Hidratante, Body Splash, Kit Maquiagem, Perfume]
      complementos: [Suave, Cítrico, Floral, Amadeirado]
      usa_cor: false   # perfume e hidratante não têm cor
    Casa:
      grupo: Casa
      skus: 8
      preco: {p25: 48.04, mediana: 79.90, p75: 115.99}  # Olist: 11.553 itens
      margem: 0.50
      tipos: [Almofada, Toalha de Banho, Manta, Cortina, Jogo de Cama]
      complementos: [Microfibra, Algodão, Linho, Percal]

  quantil_minimo: 0.15     # preço-base do tipo mais barato
  quantil_maximo: 0.85     # preço-base do tipo mais caro
  fator_complemento: [0.90, 1.15]

  cores: [Preto, Branco, Azul, Bege, Verde, Vinho, Cinza, Rosa, Marrom, Off-white]

  # Popularidade relativa de cada SKU, usada pelos geradores do ERP e do site
  # para que alguns produtos vendam muito mais que outros (padrão comum no varejo).
  # Valores de uma lognormal: mediana 1, com poucos SKUs bem acima disso.
  popularidade_sigma: 0.8

  # -------------------------------------------------------------------------
  # Catálogo v2 (D21): informações para o agente do Emanuel tirar dúvidas e
  # recomendar produtos. Tudo é montado por regra, sem sorteio: SKUs, preços,
  # custos e popularidades continuam idênticos aos da v1.
  # -------------------------------------------------------------------------

  # Concordância do nome. Tipos que não estão aqui são masculinos no singular.
  genero_tipo:
    feminino: [Blusa, Saia, Camisa, Calça, Jaqueta, Camiseta, Bermuda, Polo, Sapatilha, Sandália,
               Bota, Calcinha, Cueca, Sunga, Carteira, Mochila, Bolsa, Mala, Garrafa, Camiseta Dry,
               Legging, Almofada, Toalha de Banho, Manta, Cortina]
    masculino_plural: [Óculos de Sol]

  # Palavras que concordam com o tipo: [feminino, masculino plural]
  flexao:
    Feminino: [Feminina, Femininos]
    Masculino: [Masculina, Masculinos]
    Esportivo: [Esportiva, Esportivos]
    Estampado: [Estampada, Estampados]
    Básico: [Básica, Básicos]
    Sintético: [Sintética, Sintéticos]
    Clássico: [Clássica, Clássicos]

  # Uma imagem por tipo de produto em cada categoria; {categoria} e {tipo} viram texto sem acento, em minúsculas
  # e com hífens (ex.: Acessórios, "Óculos de Sol" -> imagens/acessorios/oculos-de-sol.png). Os arquivos de
  # imagem ficam por conta do front-end (Caio).
  imagem_padrao: "imagens/{categoria}/{tipo}.png"

  # Frase e ocasiões de uso de cada tipo, por categoria (o mesmo tipo pode ter usos
  # diferentes: a Bermuda de Esporte não é a Bermuda Masculina).
  detalhes:
    Feminino:
      Short: ["Short feminino de cintura média, confortável para o calor.", [dia a dia, praia, passeio]]
      Blusa: ["Blusa feminina de modelagem solta, fácil de combinar.", [dia a dia, trabalho]]
      Saia: ["Saia feminina na altura dos joelhos.", [trabalho, passeio]]
      Camisa: ["Camisa feminina de botões, com caimento estruturado.", [trabalho, ocasiões especiais]]
      Calça: ["Calça feminina de cintura alta e corte reto.", [trabalho, dia a dia]]
      Macacão: ["Macacão feminino de peça única, prático e versátil.", [passeio, festa]]
      Vestido: ["Vestido feminino midi, leve e fluido.", [passeio, festa]]
      Jaqueta: ["Jaqueta feminina para dias mais frescos.", [frio, passeio]]
    Masculino:
      Camiseta: ["Camiseta masculina de gola careca e manga curta.", [dia a dia, casual]]
      Bermuda: ["Bermuda masculina com bolsos, na altura dos joelhos.", [dia a dia, praia, passeio]]
      Polo: ["Camisa polo masculina, com gola e botões.", [trabalho, casual]]
      Camisa: ["Camisa masculina de botões e manga longa.", [trabalho, ocasiões especiais]]
      Calça: ["Calça masculina de corte reto.", [trabalho, dia a dia]]
      Moletom: ["Blusa de moletom masculina, quente e confortável.", [frio, casual]]
      Jaqueta: ["Jaqueta masculina para dias mais frescos.", [frio, passeio]]
    Infantil:
      Body: ["Body infantil com fechamento de botões, fácil de trocar.", [dia a dia, bebê]]
      Camiseta: ["Camiseta infantil confortável para brincar.", [dia a dia, escola]]
      Bermuda: ["Bermuda infantil com elástico na cintura.", [dia a dia, praia]]
      Pijama: ["Pijama infantil de duas peças.", [dormir]]
      Vestido: ["Vestido infantil leve, para passeios e festas.", [passeio, festa]]
      Conjunto: ["Conjunto infantil de blusa e short.", [dia a dia, passeio]]
    Calçados:
      Chinelo: ["Chinelo de dedo com solado de borracha.", [praia, casa]]
      Sapatilha: ["Sapatilha leve e flexível, fácil de calçar.", [dia a dia, trabalho]]
      Sandália: ["Sandália aberta, fresca para o calor.", [passeio, verão]]
      Tênis: ["Tênis com amortecimento no solado.", [dia a dia, caminhada]]
      Mocassim: ["Mocassim sem cadarço, de visual mais social.", [trabalho, ocasiões especiais]]
      Bota: ["Bota de cano curto, para dias frios.", [frio, passeio]]
    Moda íntima e praia:
      Calcinha: ["Calcinha de cós confortável.", [dia a dia]]
